# Costmaps for the five-robot race -- a template, not a finished file.
#
# race_launch.py substitutes the namespace marker below for each robot's
# namespace and writes one copy per robot. A single wildcarded file cannot
# serve all five: the frame names carry the namespace (r1/base_link,
# r3/base_link) precisely so that five transform trees can share one /tf
# without colliding, and a wildcard has no way to say a different frame for
# each match.
#
# The global costmap here is a 20 m rolling window built from the robot's own
# lidar, not the 1006x1674 static warehouse map the single-robot config uses.
# Five of those is five times the memory and the raytracing on four cores that
# are already carrying five physics bodies. The race runs on open floor where
# the only obstacles are the other four robots, and those are exactly what the
# lidar sees.
#
# global_frame is `map` for both, and `map` here is not a served map: it is the
# common frame the five odom origins are pinned into, one static transform per
# robot at the pose it was spawned at (race_up.sh). Rolling windows in a shared
# frame need no static layer, and the transform is exact rather than estimated,
# so there is no localiser in this race either.
/**:
  local_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: __NS__/base_link
      update_frequency: 10.0
      publish_frequency: 10.0
      width: 6
      height: 6
      resolution: 0.05
      rolling_window: true
      track_unknown_space: false
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /__NS__/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Tighter than the single-robot 0.45. Five robots on 1.3 m lane centres
        # would each sit inside the next one's inflation at 0.45 and every
        # controller would read the grid beside it as impassable before the
        # race had started.
        inflation_radius: 0.30
        cost_scaling_factor: 4.0

  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: __NS__/base_link
      update_frequency: 5.0
      publish_frequency: 5.0
      width: 20
      height: 20
      resolution: 0.05
      rolling_window: true
      track_unknown_space: false
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /__NS__/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.30
        cost_scaling_factor: 4.0
