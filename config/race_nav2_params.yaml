# One nav2 controller_server for one lane of the race -- a template, not a
# finished file.  race_launch.py substitutes __NS__ for the robot's namespace
# and __PLUGIN__ for the nav2 controller plugin racing in that lane, and writes
# one copy per nav2 lane.
#
# The point of this file is that the only thing which differs between lanes is
# __PLUGIN__.  The costmap below is a copy of the local costmap in
# race_costmap_params.yaml, which is what this package's own controllers read,
# so the comparison is between controllers and not between costmap settings: a
# 6 x 6 m rolling window at 0.05 m, built from that robot's own lidar, with a
# 0.30 m inflation and a 0.22 m robot radius.  nav2's own defaults are 3 x 3 m
# with a 0.7 m inflation and a voxel layer, and either would have been a
# defensible choice -- but not a defensible comparison.
#
# Everything the plugins themselves take is left at their defaults.  The three
# exceptions are the ones that would otherwise make the race mean different
# things in different lanes:
#
#   controller_frequency   20 Hz for everyone.
#   xy_goal_tolerance      0.15 m, the tolerance every controller in this
#                          package stops inside, so "finished" is one distance.
#   yaw_goal_tolerance     3.15 rad, which is no constraint at all: none of
#                          this package's controllers check final heading, and
#                          a nav2 lane that had to turn on the line at the end
#                          would be racing a longer race.
#
# DWB is the one plugin that will not configure without being told something:
# it has no default critic list and refuses with "No critics defined for
# FollowPath".  race_launch.py substitutes the marker below for dwb_core's
# own default critic set in that lane and for nothing in the others.  Putting
# the list in this file for everyone was tried first and broke the MPPI lane
# outright: nav2's MPPI reads the same `critics` key with an entirely
# different set of class names and refused to load DWB's -- "the class
# mppi::critics::RotateToGoal ... does not exist".
/**:
  controller_server:
    ros__parameters:
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      odom_topic: /__NS__/odom
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        # nav2's default is 10 s, and at 0.5 m that is 0.05 m/s -- which every
        # controller here goes below on its final approach, because slowing
        # into a goal is what a goal tolerance is for.  It aborted DWB 0.01 m
        # short of the finish line with "Failed to make progress", which is
        # the watchdog's result and not the controller's.  30 s still catches
        # a robot that has genuinely stopped, well inside the timer's own 25 s
        # stall check.
        movement_time_allowance: 30.0

      general_goal_checker:
        stateful: True
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.15
        yaw_goal_tolerance: 3.15

      FollowPath:
        plugin: "__PLUGIN__"
__PLUGIN_EXTRA__

  # A sibling of controller_server, not a block inside it.  The costmap
  # controller_server owns is a node in its own right -- /<ns>/local_costmap/
  # local_costmap -- and nav2's own nav2_params.yaml declares it exactly here,
  # at the top level.  Nested under controller_server it is silently ignored:
  # the first nav2 race came up with the stock defaults instead, a static_layer
  # subscribed to /r2/map that nothing serves and an obstacle_layer with no
  # observation sources, and every lane failed to activate.
  local_costmap:
    local_costmap:
      ros__parameters:
        global_frame: map
        robot_base_frame: __NS__/base_link
        initial_transform_timeout: 60.0
        update_frequency: 10.0
        publish_frequency: 10.0
        width: 6
        height: 6
        resolution: 0.05
        rolling_window: true
        track_unknown_space: false
        robot_radius: 0.22
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /__NS__/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 8.0
            raytrace_min_range: 0.0
            obstacle_max_range: 8.0
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: true
          inflation_radius: 0.30
          cost_scaling_factor: 4.0
